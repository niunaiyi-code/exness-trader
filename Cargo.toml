[workspace]
resolver = "2"
members = ["crates/exness-api", "crates/gl-strategy", "crates/gl-runtime", "crates/gl-server", "crates/exness-trader"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
publish = false

[workspace.dependencies]
# async / net
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "http2"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
url = "2"

# crypto
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "zeroize", "rand_core"] }
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde", "maths"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# misc
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# metrics & observability
prometheus = "0.13"
lazy_static = "1.4"

[profile.dev]
debug = 1 # 仅保留行号信息，大幅削减巨型 PDB 符号体积，避免磁盘膨胀

[profile.test]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
