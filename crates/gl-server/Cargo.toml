[package]
name = "gl-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Auth & Crypto
jsonwebtoken = "9"
argon2 = "0.5"
aes-gcm = "0.10"
base64 = "0.21"

# Workspace crates
exness-api = { path = "../exness-api" }
gl-strategy = { path = "../gl-strategy" }
gl-runtime = { path = "../gl-runtime" }

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
chrono = "0.4"
reqwest = { workspace = true }
uuid = { version = "1.0", features = ["v4", "serde"] }
rust_decimal = "1.33"
url = { workspace = true }
rand = { workspace = true }
prometheus = "0.13"

[dev-dependencies]
axum-test = "15"
tokio-test = "0.4"
wiremock = "0.6"
